<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b70">
  <title>Đăng nhập | KPI Portal</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17243a;background:#f2f5f9;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef3f8,#e8edf5)}
    .card{width:min(100%,430px);background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:40px;box-shadow:0 20px 60px rgba(26,48,82,.12)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#173b70;color:#fff;font-size:20px;font-weight:800}.brand-name{font-size:20px;font-weight:750;letter-spacing:-.03em}.brand-name span{color:#3d69b1}
    h1{margin:0 0 8px;font-size:27px;letter-spacing:-.04em}.intro{margin:0 0 28px;color:#66748a;font-size:14px;line-height:1.6}
    label{display:block;margin:18px 0 7px;font-size:13px;font-weight:650;color:#35445b}input{width:100%;height:48px;padding:0 13px;border:1px solid #cfd8e5;border-radius:9px;background:#fff;color:#17243a;font:inherit;outline:none}input:focus{border-color:#3d69b1;box-shadow:0 0 0 3px rgba(61,105,177,.13)}
    button{width:100%;height:48px;margin-top:25px;border:0;border-radius:9px;background:#173b70;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#224d8c}button:disabled{opacity:.65;cursor:wait}
    #login-error{display:none;margin:16px 0 0;padding:11px 13px;border:1px solid #f2c7c7;border-radius:8px;background:#fff1f1;color:#b42318;font-size:13px}#login-error.visible{display:block}
    .foot{margin:24px 0 0;text-align:center;color:#8994a5;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-mark" aria-hidden="true">K</div><div class="brand-name">KPI<span>Portal</span></div></div>
    <h1>Đăng nhập hệ thống</h1>
    <p class="intro">Sử dụng tài khoản cán bộ được cấp để truy cập hệ thống đánh giá KPI.</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Tài khoản</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="Email hoặc mã cán bộ" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
      <div id="login-error" role="alert" aria-live="polite">Sai tài khoản hoặc mật khẩu.</div>
      <button id="login-submit" type="submit">Đăng nhập</button>
    </form>
    <p class="foot">Hệ thống quản lý đánh giá hiệu quả công tác</p>
  </main>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
